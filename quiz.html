<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/DevQuizLogo.png" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header id="header"></header>
    <div class="quiz-app">
      <div class="quiz-info">
        <div class="category">
          Category <span class="selectedCategory"></span>
        </div>
        <div class="cont">Question Count: <span></span></div>
      </div>
      <div class="quiz-area"></div>
      <div class="answers-area"></div>
      <button class="submit-button">Submit Answer</button>
      <div class="bullets">
        <div class="spans"></div>
        <div class="countdown"></div>
      </div>
      <div class="results"></div>
    </div>
    <footer id="footer"></footer>
  </body>
</html>
